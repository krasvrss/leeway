name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install Capacitor
        run: npm ci

      - name: Stamp the build number into the app
        run: sed -i "s/__LW_BUILD__/${{ github.run_number }}/" www/index.html

      - name: Copy the app into the Android project
        run: npx cap sync android

      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -PlwBuild=${{ github.run_number }}

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: leeway-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # The app checks this release and shows an update banner to everyone on an older build.
      # The release note is the first line of the latest commit message.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk leeway.apk
          gh release create "v${{ github.run_number }}" leeway.apk \
            --title "Leeway ${{ github.run_number }}" \
            --notes "$(git log -1 --pretty=%s)" --latest
