<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
#boot{position:fixed;inset:0;display:grid;place-items:center;background:#0f2128;color:#e2eded;font:600 15px system-ui,sans-serif;z-index:100}
#boot b{display:block;font:700 34px "Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:.04em;text-align:center}
.refresh{border:0;background:none;padding:0;font:inherit;color:var(--accent);text-decoration:underline;cursor:pointer}

<body>

<title>Leeway</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed chart canvas; top instrument bar; bottom time rail; spot sheet docks right on desktop, slides up on phones */
:root{
  --bg:#e9efee; --sea:#c9d8db; --land:#e4ddcc; --coast:#6c7c82; --grat:rgba(16,35,43,.10);
  --ink:#10232b; --muted:#56696f; --panel:#fbfcfb; --panel-2:#f1f5f4; --line:#d3dcdb;
  --accent:#d6501b; --accent-ink:#fff; --particle:rgba(12,28,34,.55); --label:#3d4f55; --river:#2a6f8f; --iso:#1d4f73; --iso-ink:#1d4f73;
  --shadow:0 8px 28px rgba(16,35,43,.14);
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a1317; --sea:#0f2128; --land:#1b282b; --coast:#56707a; --grat:rgba(220,236,236,.08);
  --ink:#e2eded; --muted:#8ea2a6; --panel:#101d22; --panel-2:#15262c; --line:#24363c;
  --accent:#ff7a3d; --accent-ink:#1a0d06; --particle:rgba(240,250,250,.62); --label:#a9bcbf; --river:#7fc3e0; --iso:#cfe6f2; --iso-ink:#dff0f8;
  --shadow:0 8px 28px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a1317; --sea:#0f2128; --land:#1b282b; --coast:#56707a; --grat:rgba(220,236,236,.08);
  --ink:#e2eded; --muted:#8ea2a6; --panel:#101d22; --panel-2:#15262c; --line:#24363c;
  --accent:#ff7a3d; --accent-ink:#1a0d06; --particle:rgba(240,250,250,.62); --label:#a9bcbf; --river:#7fc3e0; --iso:#cfe6f2; --iso-ink:#dff0f8;
  --shadow:0 8px 28px rgba(0,0,0,.45); color-scheme:dark}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:auto 1fr;}
/* top bar */
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--panel);border-bottom:1px solid var(--line);position:relative;z-index:5}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto}
.brand b{font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:.02em;text-transform:uppercase}
.brand span{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.seg{display:inline-flex;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:2px}
.seg button{border:0;background:transparent;padding:5px 10px;border-radius:6px;font-size:13px;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.seg.units button{font-family:var(--f-mono);font-size:12px;padding:5px 8px}
.lang{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:0 4px 0 8px;color:var(--muted);height:30px}
.lang select{border:0;background:transparent;color:var(--ink);font:500 13px var(--f-body);padding:4px 2px;cursor:pointer;max-width:120px}
.lang select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.lang select option{background:var(--panel);color:var(--ink)}
.lang{position:absolute;top:10px;right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:821px){ .bar{padding-right:calc(max(16px,env(safe-area-inset-right,0px)) + 150px)} }
/* main */
.main{position:relative;min-height:0;display:grid;grid-template-columns:1fr auto}
.mapwrap{position:relative;min-width:0;overflow:hidden;touch-action:none;background:var(--sea)}
.mapwrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#cv-land{cursor:crosshair}
.notice{position:absolute;top:10px;left:max(12px,env(safe-area-inset-left,0px));right:auto;z-index:3;
  font-family:var(--f-mono);font-size:11px;color:var(--muted);background:color-mix(in srgb,var(--panel) 88%,transparent);
  border:1px solid var(--line);border-radius:6px;padding:5px 8px;max-width:calc(100% - 84px)}
.zoom{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:10px;z-index:3;display:flex;flex-direction:column;
  background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;box-shadow:var(--shadow)}
.zoom button{border:0;background:transparent;width:36px;height:36px;font-size:18px;line-height:1}
.zoom button+button{border-top:1px solid var(--line)}
.zoom button svg{display:block;margin:auto}
#fsbtn .ico-close{display:none} .app.full #fsbtn .ico-open{display:none} .app.full #fsbtn .ico-close{display:block}
.app.full{grid-template-rows:1fr}
.app.full .bar,.app.full .rail{display:none}
.app.full .readout,.app.full .legend{bottom:calc(58px + env(safe-area-inset-bottom,0px))}
.fsexit{display:none;position:absolute;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:4;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:8px 16px;font:600 13px var(--f-body);box-shadow:var(--shadow)}
.app.full .fsexit{display:block}
#cv-land{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.namerow .fine{grid-column:1/-1}
.seactl{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:168px;z-index:3;display:grid;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px;box-shadow:var(--shadow);width:104px}
.seactl button{border:1px solid var(--line);background:var(--panel-2);border-radius:6px;font-size:11px;font-weight:600;padding:4px 6px;color:var(--muted)}
.seactl button[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.seactl .fine{font-size:9px;line-height:1.35;font-family:var(--f-mono)}
.dropkey{display:inline-block;width:9px;height:9px;border-radius:2px;background:rgba(128,56,176,.5);margin-right:4px;vertical-align:-1px}
.readout{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:176px;z-index:3;display:grid;gap:1px;text-align:left;background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-family:var(--f-mono);font-size:11px;color:var(--ink);box-shadow:var(--shadow);cursor:copy}
.readout span{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.readout b{font-weight:600;font-variant-numeric:tabular-nums}
.legend{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:142px;z-index:3;background:var(--panel);
  border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-family:var(--f-mono);font-size:10px;color:var(--muted);box-shadow:var(--shadow)}
.legend .bar-c{height:8px;width:150px;border-radius:3px;margin:4px 0 2px}
.legend .ticks{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
/* bottom rail */
.rail{position:absolute;left:0;right:0;bottom:0;z-index:4;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-top:10px;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));
  background:linear-gradient(to top,var(--panel) 70%,color-mix(in srgb,var(--panel) 0%,transparent));display:grid;gap:8px}
.spots{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.spots::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 10px 5px 8px;font-size:13px;white-space:nowrap}
.chip .kn{font-family:var(--f-mono);font-size:11px;padding:1px 5px;border-radius:4px;color:#0b1418;font-variant-numeric:tabular-nums}
.chip.live::before{content:"";width:6px;height:6px;border-radius:50%;background:#2fae6b;flex:none}
.chip[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.timebar{display:grid;grid-template-columns:auto auto 1fr;align-items:center;gap:10px}
.play{width:36px;height:36px;border-radius:50%;border:0;background:var(--ink);color:var(--panel);display:grid;place-items:center}
.when{font-family:var(--f-display);font-size:20px;font-weight:600;min-width:118px;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.when small{display:block;font-family:var(--f-mono);font-size:10px;color:var(--muted);font-weight:400;letter-spacing:0}
.track{position:relative;min-width:0}
.track input{width:100%;accent-color:var(--accent);margin:0}
.days{display:flex;font-family:var(--f-mono);font-size:10px;color:var(--muted);margin-top:2px}
.days span{flex:1;border-left:1px solid var(--line);padding-left:4px;white-space:nowrap;overflow:hidden}
/* spot sheet */
.sheet{width:400px;min-width:0;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.sheet-in{overflow-y:auto;padding:16px;display:grid;gap:16px;align-content:start;grid-auto-rows:max-content;grid-template-columns:minmax(0,1fr)}
.sh-head{display:flex;align-items:flex-start;gap:10px}
.sh-head h2{margin:0;font-family:var(--f-display);font-size:26px;font-weight:700;line-height:1.05;text-wrap:balance}
.sh-head .coords{font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-top:3px}
.sh-head .grow{flex:1;min-width:0}
.iconbtn{border:1px solid var(--line);background:var(--panel-2);border-radius:8px;height:34px;padding:0 10px;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.iconbtn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.closebtn{border:0;background:transparent;width:34px;height:34px;font-size:20px;color:var(--muted)}
.namerow{display:flex;gap:6px}
.namerow input{flex:1;min-width:0;border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:7px 10px;font:inherit;color:var(--ink)}
.now{display:grid;grid-template-columns:auto 1fr 1fr;gap:12px;align-items:center;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:12px}
.dial{width:74px;height:74px}
.stat .k{font-family:var(--f-mono);font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.stat .v{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.stat .v small{font-size:14px;font-weight:600;color:var(--muted);margin-left:3px}
.stat .s{font-size:12px;color:var(--muted);margin-top:2px}
.subrow{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid var(--line);padding-top:10px}
.subrow .v{font-size:20px}
.secthead{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.secthead h3{margin:0;font-family:var(--f-mono);font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;scrollbar-width:thin}
table.fc{border-collapse:collapse;font-family:var(--f-mono);font-size:11px;font-variant-numeric:tabular-nums}
table.fc th,table.fc td{padding:0;text-align:center;min-width:38px;height:26px;border-right:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
table.fc th.rowh{position:sticky;left:0;z-index:1;background:var(--panel);text-align:left;padding:0 8px;min-width:64px;font-weight:500;color:var(--muted);border-right:1px solid var(--line)}
table.fc tr.day td{font-weight:500;color:var(--ink);text-align:left;padding-left:5px;background:var(--panel-2)}
table.fc tr.hr td{color:var(--muted)}
table.fc td.c{cursor:pointer}
table.fc td.sel{box-shadow:inset 0 0 0 2px var(--accent)}
table.fc td.spd{color:#0b1418;font-weight:500}
table.fc svg{display:block;margin:auto}
.tide svg{width:100%;height:auto;display:block}
.tide .lbl{font-family:var(--f-mono);font-size:10px;fill:var(--muted)}
.tidelist{display:flex;gap:6px;flex-wrap:wrap;font-family:var(--f-mono);font-size:11px}
.tidelist span{border:1px solid var(--line);border-radius:6px;padding:3px 6px;background:var(--panel-2)}
.fine{font-size:11px;color:var(--muted);line-height:1.5}
.empty{color:var(--muted);font-size:13px;line-height:1.5}
.fish{display:grid;gap:10px}
.seg.stages{display:grid;grid-template-columns:repeat(4,1fr)}
.seg.stages.areas{grid-template-columns:repeat(3,1fr)}
.seg.stages.areas4{grid-template-columns:repeat(4,auto)}
.seg.stages.areas4 button{font-size:12px;padding:5px 6px}
.seg.stages button[aria-pressed="true"]{background:var(--st);color:#fff}
.strip{width:100%;height:auto;display:block}
.strip .lbl{font-family:var(--f-mono);font-size:10px;fill:var(--muted)}
.legend-row{display:flex;flex-wrap:wrap;gap:10px}
.legend-row i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
ol.zones{margin:0;padding:0;list-style:none;display:grid;gap:6px}
ol.zones li{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--panel-2);cursor:pointer}
ol.zones li:hover{border-color:var(--muted)}
.zh{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.zh b{font-size:13px}
.dots{font-family:var(--f-mono);font-size:12px;letter-spacing:2px}
.wins{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px}
.win{border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:6px 8px;text-align:left;display:grid;gap:2px;font-size:12px}
.win b{font-family:var(--f-display);font-size:16px}
.win span{color:var(--muted)}
.linkbtn{border:0;background:none;color:var(--muted);font-size:11px;text-decoration:underline;padding:2px}
.calbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ink);background:var(--panel);border-radius:8px;padding:6px 10px;font-size:13px;font-weight:600}
.calopen{justify-content:center}
.calbtn[aria-pressed="true"]{background:#1f5f99;border-color:#1f5f99;color:#fff}
.calbtn[aria-pressed="true"]::after{content:"ON";font-family:var(--f-mono);font-size:9px;font-weight:600;background:rgba(255,255,255,.22);border-radius:4px;padding:1px 4px;margin-left:2px}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.calgrid .wd{font-family:var(--f-mono);font-size:10px;color:var(--muted);text-align:center;text-transform:uppercase}
.cday{position:relative;border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:4px 4px 7px;display:grid;justify-items:center;gap:2px;min-height:52px}
.cday.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cday .dn{font-family:var(--f-display);font-weight:700;font-size:15px;line-height:1;font-variant-numeric:tabular-nums}
.cday .dn small{display:block;font-family:var(--f-mono);font-weight:400;font-size:8px;color:var(--muted);text-transform:uppercase}
.cday .cbar{position:absolute;left:4px;bottom:3px;height:3px;border-radius:2px;max-width:calc(100% - 8px)}
.cday .fx,.fxk{font-family:var(--f-mono);font-size:8px;font-weight:600;color:var(--accent)}
.cday .fx{position:absolute;top:3px;right:4px}
.dayd{display:grid;gap:10px}
.dscore{display:flex;align-items:center;gap:12px}
.dscore .big{font-family:var(--f-display);font-size:44px;font-weight:700;line-height:1}
.dscore>div:nth-child(2){flex:1}
ul.factors{margin:0;padding:0;list-style:none;display:grid;gap:3px}
ul.factors li{display:grid;grid-template-columns:72px 1fr auto;gap:8px;align-items:baseline;font-size:12px;border-bottom:1px dashed var(--line);padding-bottom:3px}
ul.factors b{font-family:var(--f-mono);font-size:12px}
ul.factors b.pos{color:#2f9e5c} ul.factors b.neg{color:#c7553d}
.times{display:flex;flex-wrap:wrap;gap:6px;font-size:11px}
.times span{border:1px solid var(--line);border-radius:6px;padding:3px 6px;background:var(--panel-2)}
.times b{font-family:var(--f-mono);font-weight:500}
ol.lures{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.lurecard{border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:grid;gap:5px;background:var(--panel-2)}
.lh{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.lh b{font-size:13px}
.lc{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px}
.colrow{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-flex;border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.sw i{width:9px;height:14px;display:block}
b.k{font-family:var(--f-mono);font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink);font-weight:500;margin-right:4px}
.tackle{border-left:3px solid var(--accent);padding-left:8px}
.hbtns{display:flex;gap:6px}
@media (max-width:820px){.hbtns{order:3}}
.spchips{display:flex;flex-wrap:wrap;gap:6px}
.spchips button{border:1px solid var(--line);background:var(--panel-2);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;display:inline-flex;align-items:baseline;gap:5px}
.spchips button small{font-weight:400;font-size:10px;color:var(--muted);font-family:var(--f-mono)}
.spchips button[aria-pressed="true"]{background:var(--spc);border-color:var(--spc);color:#fff}
.spchips button[aria-pressed="true"] small{color:rgba(255,255,255,.8)}
.spchips button[data-sp="all"][aria-pressed="true"]{color:var(--panel)}
.spchips.grouped{display:grid;gap:6px}
.spg{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.spl{font-family:var(--f-mono);font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);width:100%}
ol.zones li.on{border-color:#d2401e;box-shadow:inset 0 0 0 1px #d2401e}
.tgts{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.tgts span{font-size:11px;font-weight:600;color:#fff;background:var(--spc);border-radius:999px;padding:1px 8px}
.trc{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.row2 .addph{flex:1 1 140px}
.season{margin:0}
.tog{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:5px}
.pers{color:var(--accent)}
.row2{display:flex;flex-wrap:wrap;gap:6px}
.row2 .iconbtn{flex:1 1 auto;justify-content:center}
.iconbtn.danger{color:#c7553d;border-color:#c7553d}
.ins{display:grid;gap:10px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.tiles div{border:1px solid var(--line);border-radius:10px;padding:6px 8px;background:var(--panel-2);display:grid}
.tiles b{font-family:var(--f-display);font-size:22px;line-height:1.05;font-variant-numeric:tabular-nums}
.tiles span{font-size:10px;color:var(--muted);font-family:var(--f-mono)}
.pattern{margin:0;font-size:13px;border-left:3px solid var(--accent);padding-left:8px}
.insg{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px 14px;align-items:start}
.mcols{grid-column:1/-1}
.mc{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:3px;align-items:end}
.mc>div{display:grid;justify-items:center;gap:1px}
.mb{height:44px;width:100%;background:var(--panel-2);border-radius:3px;display:flex;align-items:flex-end;overflow:hidden}
.mb i{display:block;width:100%;border-radius:3px}
.ml{font-family:var(--f-mono);font-size:9px;color:var(--muted)}
.mn{font-family:var(--f-mono);font-size:9px;min-height:11px}
.ms{display:grid;grid-template-columns:2fr 3fr 3fr 3fr 1fr;text-align:center;border-top:1px solid var(--line);padding-top:2px;font-size:9px}
.bars{display:grid;gap:2px;font-size:11px}
.bars .bt{font-family:var(--f-mono);font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:2px}
.br{display:grid;grid-template-columns:minmax(0,100px) 1fr 22px;gap:6px;align-items:center}
.bl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bb{height:7px;background:var(--panel-2);border-radius:4px;overflow:hidden}
.bb i{display:block;height:100%;border-radius:4px}
.bn{font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
ul.recs{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.rec{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:6px;background:var(--panel-2);cursor:pointer}
.rec:hover{border-color:var(--muted)}
.thumb{width:56px;height:56px;border-radius:8px;object-fit:cover;flex:none;display:block;background:var(--line)}
.thumb.ph{opacity:.35}
.rt{display:grid;gap:1px;min-width:0}
.rt b{font-size:13px}
.entry{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.entry .wide{grid-column:1/-1}
.entry label{display:grid;gap:3px;font-size:11px;color:var(--muted);font-family:var(--f-mono)}
.entry input,.entry select,.condgrid input,.condgrid select{font:inherit;font-size:13px;color:var(--ink);background:var(--panel-2);border:1px solid var(--line);border-radius:7px;padding:6px 8px;min-width:0;width:100%}
.photos{display:grid;gap:6px}
.phs{display:flex;flex-wrap:wrap;gap:6px}
.phw{position:relative}
.phw img{width:84px;height:84px;object-fit:cover;border-radius:8px;display:block}
.phx{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:14px;line-height:1}
.addph{border:1px dashed var(--muted);border-radius:10px;padding:12px;text-align:center;font-size:14px;color:var(--ink);cursor:pointer;font-family:var(--f-body)}
.whererow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.warn{margin:0;color:#c7553d;font-size:12px;font-weight:600}
.autos{display:flex;flex-wrap:wrap;gap:5px;font-size:11px}
.autos span{border:1px solid var(--line);border-radius:6px;padding:3px 6px;background:var(--panel-2)}
.condgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.condgrid label{display:grid;gap:3px;font-size:10px;color:var(--muted);font-family:var(--f-mono)}
.gallery{display:flex;gap:6px;overflow-x:auto}
.gallery img{height:160px;border-radius:10px;cursor:zoom-in;flex:none;max-width:100%;object-fit:cover}
.gallery img.big{height:auto;width:100%;cursor:zoom-out}
.gallery.lureph img{height:110px}
.lurephotos{border-top:1px dashed var(--line);padding-top:8px}
.lpt{margin-bottom:6px}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 12px;font-size:12px}
.kv div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--line);padding:3px 0}
.kv span{color:var(--muted)}
.note{margin:0;font-size:13px;background:var(--panel-2);border-radius:8px;padding:8px 10px}
.nophoto{font-size:11px;color:var(--muted)}
.csvbox{width:100%;height:120px;font-family:var(--f-mono);font-size:11px}
.toast{position:absolute;left:50%;top:56px;transform:translateX(-50%);z-index:6;background:var(--ink);color:var(--panel);padding:7px 12px;border-radius:8px;font-size:13px;pointer-events:none;opacity:0;transition:opacity .2s}
.toast.show{opacity:1}
@media (max-width:820px){
  .main{grid-template-columns:1fr}
  .sheet{position:absolute;left:0;right:0;bottom:0;width:auto;max-height:62%;z-index:7;border-left:0;border-top:1px solid var(--line);
    border-radius:16px 16px 0 0;box-shadow:var(--shadow);padding-bottom:env(safe-area-inset-bottom,0px)}
  .sheet-in{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .sheet::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 0}
  .legend{display:none}
  .brand span{display:none}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}

ave":"Spremi","Save pin":"Spremi oznaku","Rename":"Preimenuj","✎ Rename":"✎ Preimenuj","Pins stay on the map with their name. Tap ★ again to remove one.":"Oznake ostaju na karti s nazivom. Ponovno dodirnite ★ za uklanjanje.","Pin dropped at the map centre. Name it and save.":"Oznaka postavljena u središte karte. Nazovite je i spremite.","Full-screen map":"Karta preko cijelog zaslona","Drop a pin at the map centre":"Postavi oznaku u središte karte","Drop a pin (or press and hold on the map)":"Postavi oznaku (ili držite prst na karti)","Show controls":"Prikaži izbornik","Saved":"Spremljeno","Removed":"Uklonjeno","Renamed":"Preimenovano","Live forecast spots stay in the list":"Lokacije s prognozom uživo ostaju na popisu","My spot":"Moja lokacija","Catch log (":"Dnevnik ulova (","Catch log ({n}) →":"Dnevnik ulova ({n}) →","Fish calendar →":"Ribolovni kalendar →","Sea level, next 48 h":"Razina mora, sljedećih 48 h","Tide, next 48 h":"Plima i oseka, sljedećih 48 h","tide + surge, metres vs. mean sea level":"plima + uspor, metri u odnosu na srednju razinu mora","astronomical, local datum":"astronomska, lokalna nula","Tide curve for the next 48 hours":"Krivulja plime i oseke za sljedećih 48 sati","Tide curve for the next {n} hours":"Krivulja plime i oseke za sljedećih {n} sati","Zoom map to this spot":"Približi kartu ovoj lokaciji","⌕ Zoom in":"⌕ Približi","Close forecast":"Zatvori prognozu","Conditions":"Uvjeti","5-day forecast":"Prognoza za 5 dana","Sample forecast generated in the prototype. Live data is wired up for Červar Porat, Poreč and Tarska uvala. Not for navigation.":"Primjer prognoze iz prototipa. Podaci uživo postoje za Červar Porat, Poreč i Tarsku uvalu. Nije za navigaciju.","Live forecast.":"Prognoza uživo.","Wind, gusts and air temperature from Open-Meteo's best-match weather models for the grid cell nearest this spot ({n}°N {n}°E, {n} km away).":"Vjetar, udari i temperatura zraka iz najprikladnijih Open-Meteo vremenskih modela za ćeliju mreže najbližu ovoj ":"Jezik","Wind map of the Adriatic. Tap the water to see the forecast for that point.":"Karta vjetra Jadrana. Dodirnite more za prognozu za tu točku.","● spots use live forecasts · wind map simulated · not for navigation":"● lokacije koriste prognozu uživo · karta vjetra je simulirana · nije za navigaciju","Zoom in":"Približi","Zoom out":"Udalji","Seafloor":"Morsko dno","Depth lines":"Izobate","Drop-offs":"Padine","a line every {n} m":"linija svaka {n} m","steep slope":"strmi pad dna","Copy coordinates":"Kopiraj koordinate","Copied":"Kopirano","Saved spots":"Spremljene lokacije","Forecast time":"Vrijeme prognoze","next {n} days":"sljedećih {n} dana","Leeway {n} is available":"Dostupan je Leeway {n}","Download":"Preuzmi","Later":"Kasnije","Excellent":"Odlično","Very good":"Vrlo dobro","Good":"Dobro","Fair":"Osrednje","Poor":"Slabo","Forecast updated":"Prognoza ažurirana","Refresh":"Osvježi","Offline":"Izvan mreže","forecast from":"prognoza od","not for navigation":"nije za navigaciju","map © OpenStreetMap":"karta © OpenStreetMap","depth EMODnet":"dubina EMODnet","forecast Open-Meteo":"prognoza Open-Meteo","Bluefish":"Strijelka","strijelka":"Pomatomus saltatrix","Bluefish drop back to the deeper edges when the shallows drain.":"Strijelke se povlače na dublje rubove kad se plićaci isprazne.","Bait and bluefish move in along the edges as the water rises.":"Sitna riba i strijelke ulaze uz rubove kako voda raste.","Fish spread over shallower water, so they're harder to pin down.":"Riba se raširi po plićoj vodi pa ju je teže pronaći.","Falling water pushes river water and bait out. The best stage for bluefish here.":"Voda koja pada izbacuje riječnu vodu i sitnu ribu van. Najbolja faza za strijelku ovdje.","Bait gets flushed out of the Mirna here; bluefish raid it on the ebb.":"Ovdje Mirna izbacuje sitnu ribu; strijelke je napadaju za oseke.","Bluefish chase bait onto the shallow flat as the water rises.":"Strijelke tjeraju sitnu ribu na plitku ravnicu kako voda raste.","The edge between river and sea water collects bait. A top bluefish line.":"Granica riječne i morske vode skuplja sitnu ribu. Vrhunska linija za strijelku.","Points make current and eddies that bluefish patrol.":"Rtovi stvaraju struju i vrtloge koje strijelke obilaze.","Bluefish run the shoreline at first and last light.":"Strijelke prolaze uz obalu u zoru i u sumrak.","Bait schools round the breakwater; bluefish hit the outer corner.":"Jata sitne ribe kruže oko lukobrana; strijelke napadaju na vanjskom kutu.","Bluefish hold on the slope and push bait up it.":"Strijelke se drže padine i tjeraju sitnu ribu uz nju.","Schools roam open water here. Look for birds and bait breaking the surface.":"Jata ovdje lutaju otvorenim morem. Tražite ptice i sitnu ribu koja izbija na površinu.","Bluefish wait deep when the shallows drain or the sun is high.":"Strijelke čekaju u dubini kad se plićaci isprazne ili je sunce visoko.","No minimum size in Croatia.":"U Hrvatskoj nema minimalne veličine.","Leerfish":"Lica","lica":"Lichia amia","Leerfish wait at the deeper edge of the mouth and outside the harbour.":"Lice čekaju na dubljem rubu ušća i ispred luke.","Leerfish follow mullet in along the shore as the tide rises.":"Lice prate ciple uz obalu kako plima raste.","Mullet spread onto the flat and along the shore, and leerfish follow them.":"Cipli se šire po plićaku i uz obalu, a lice ih prate.","Mullet drop out of the river and shallows. Leerfish ambush them at the mouth.":"Cipli izlaze iz rijeke i plićaka. Lice ih vrebaju na ušću.","Leerfish hunt mullet at the Mirna mouth. The top leerfish spot here.":"Lice love ciple na ušću Mirne. Najbolje mjesto za licu ovdje.","Leerfish follow mullet onto the flat at high water.":"Lice prate ciple na plićak za visoke vode.","Leerfish cruise the plume edge after garfish and mullet.":"Lice krstare rubom riječne vode za iglicama i ciplima.","Leerfish swing round points on the moving tide.":"Lice obilaze rtove dok se voda kreće.","Leerfish patrol the shoreline after mullet at dawn and dusk.":"Lice u zoru i sumrak obilaze obalu tražeći ciple.","Mullet gather in the harbour; leerfish wait at the entrance and breakwater tip.":"Cipli se skupljaju u luci; lice čekaju na ulazu i vrhu lukobrana.","Some leerfish hold on the edge in the middle of the day.":"Poneka lica se usred dana drži ruba.","Leerfish rarely hang in open water away from structure.":"Lice se rijetko zadržavaju na otvorenom, daleko od strukture.","Too deep and open for leerfish.":"Previše duboko i otvoreno za licu.","No minimum size in Croatia. Big fish fight hard: use strong tackle and release the large breeders.":"U Hrvatskoj nema minimalne veličine. Velike ribe se snažno bore: koristite jak pribor i pustite velike matice.","Seabass":"Lubin","lubin / brancin":"Dicentrarchus labrax","Seabass hold at the deeper edge of the mouth and round rocky points.":"Lubini se drže dubljeg ruba ušća i stjenovitih rtova.","Seabass move onto flats and rocks as the tide rises. A top seabass stage.":"Lubini izlaze na plićake i kamenje kako plima raste. Vrhunska faza za lubina.","Seabass search the shallows and weed close to the rocks.":"Lubini pretražuju plićake i alge uz kamenje.","The outgoing current at the mouth brings food to waiting seabass.":"Izlazna struja na ušću donosi hranu lubinima koji čekaju.","Brackish, stained water at the Mirna mouth draws seabass, especially at night and in winter.":"Bočata, zamućena voda na ušću Mirne privlači lubine, osobito noću i zimi.","Seabass feed on crabs and shrimp over the flat on the rising tide.":"Lubini se za plime hrane rakovima i kozicama na plićaku.","Seabass sit on the edge of the plume where the current carries food.":"Lubini stoje na rubu riječne vode gdje struja nosi hranu.","Rocky points with white water are classic seabass spots.":"Stjenoviti rtovi s pjenom klasična su mjesta za lubina.","Seabass hunt close to the rocks, often in under a metre of water.":"Lubini love uz kamenje, često u manje od metra vode.","Seabass hide along the breakwater and under harbour lights at night.":"Lubini se noću skrivaju uz lukobran i pod lučkim svjetlima.","Seabass drop to the edge in bright, calm weather.":"Za vedrog i mirnog vremena lubini se spuštaju na rub.","Seabass are rarely found in open water here.":"Lubini se ovdje rijetko nalaze na otvorenom.","Too deep for seabass from shore or kayak.":"Previše duboko za lubina s obale ili kajaka.","Minimum size 25 cm. Cut the lower lobe of the tail fin on any seabass you keep.":"Minimalna veličina 25 cm. Svakom zadržanom lubinu odrežite donji režanj repne peraje.","No fish":"Bez ribe","Other":"Ostalo","Dentex":"Zubatac","zubatac":"Dentex dentex","Dentex sit deeper on the slope; slow jigging works best.":"Zubaci stoje dublje na padini; najbolje radi sporo jigiranje.","Moving water gets the bait schools going, and dentex hunt the drop-offs.":"Pokretna voda pokreće jata sitne ribe, a zubaci love na padinama.","Activity slows; work the deeper edges.":"Aktivnost slabi; lovite dublje rubove.","Current on the points and drop-offs switches dentex on.":"Struja na rtovima i padinama aktivira zubace.","Steep rocky points are where dentex ambush bait at first light.":"Na strmim stjenovitim rtovima zubaci u zoru vrebaju sitnu ribu.","Rocky drop-offs with current are prime dentex ground.":"Stjenovite padine sa strujom vrhunska su pozicija za zubaca.","Dentex patrol the 12–20 m shelf after bait schools and squid.":"Zubaci obilaze plato na 12–20 m za jatima sitne ribe i lignjama.","Deeper rock and rubble holds the bigger dentex.":"Dublje kamenje i šljunak drže veće zubace.","Dentex come close to rocky shore only at first light.":"Zubaci prilaze stjenovitoj obali samo u zoru.","Minimum size 30 cm; up to 20% of the dentex you keep (by weight) may be 25–30 cm.":"Minimalna veličina 30 cm; do 20% zadržanih zubaca (po masi) smije biti 25–30 cm.","Bonito":"Palamida","palamida":"Sarda sarda","Schools roam the open water; look for birds.":"Jata lutaju otvorenim morem; tražite ptice.","Bait pushed along the coast by the current draws bonito to the edges.":"Sitna riba koju struja nosi uz obalu privlači palamide na rubove.","Schools range wide; cover water.":"Jata se široko kreću; pokrijte što više mora.","Bonito hit bait on the current lines off the points and the bay mouth.":"Palamide napadaju sitnu ribu na strujnim linijama ispred rtova i ulaza u uvalu.","Open water 18–25 m deep: where bonito schools travel along the coast.":"Otvoreno more dubine 18–25 m: tuda jata palamida putuju uz obalu.","Bonito chase bait over the shelf, often breaking the surface.":"Palamide tjeraju sitnu ribu nad platoom, često izbijajući na površinu.","Schools follow the edge of the slope at dawn.":"Jata u zoru prate rub padine.","Bonito sometimes push bait up to the plume edge.":"Palamide ponekad dotjeraju sitnu ribu do ruba riječne vode.","Check the current Croatian rules before you keep any.":"Prije zadržavanja ulova provjerite važeće hrvatske propise.","Amberjack":"Gof","gof":"Seriola dumerili","Gof sit deeper on the rocks and wrecks; jig them slowly.":"Gofovi stoje dublje na kamenju i olupinama; jigirajte polako.","Moving water bunches the bait, and gof hunt along the drop-offs.":"Pokretna voda zbija sitnu ribu, a gofovi love uz padine.","Gof spread out; look for them under floating objects and round buoys.":"Gofovi se raštrkaju; tražite ih ispod plutajućih predmeta i oko bova.","Current on the points and drop-offs switches gof on.":"Struja na rtovima i padinama aktivira gofove.","Steep rocky points with current: gof push bait against the rocks here.":"Strmi stjenoviti rtovi sa strujom: ovdje gofovi tjeraju sitnu ribu uz stijene.","Rocky drop-offs and isolated rocks are prime gof ground.":"Stjenovite padine i usamljene hridi vrhunska su pozicija za gofa.","Gof patrol the shelf after bait schools, often round buoys, mussel farms and anything floating.":"Gofovi obilaze plato za jatima sitne ribe, često oko bova, uzgajališta dagnji i svega što pluta.","Wrecks and deeper rock hold the bigger gof.":"Olupine i dublje kamenje drže veće gofove.","Small gof hunt round the outer breakwater and moorings in late summer.":"Mali gofovi krajem ljeta love oko vanjskog lukobrana i vezova.","Young gof follow bait along the plume edge and floating weed.":"Mladi gofovi prate sitnu ribu uz rub riječne vode i plutajuće alge.","Minimum size 45 cm; up to 20% of the gof you keep (by weight) may be 25–45 cm.":"Minimalna veličina 45 cm; do 20% zadržanih gofova (po masi) smije biti 25–45 cm.","Garfish":"Iglica","iglica":"Belone belone","Garfish stay out on the open surface away from the shallows.":"Iglice ostaju na otvorenoj površini, daleko od plićaka.","Rising water brings garfish schools close to points and harbour walls.":"Plima dovodi jata iglica blizu rtova i lučkih zidova.","Garfish cruise the surface all along the shore.":"Iglice krstare površinom duž cijele obale.","Garfish line up on the current seams and the plume edge to pick off small fry.":"Iglice se poredaju na strujnim granicama i rubu riječne vode i hvataju mlađ.","The plume edge collects fry and plankton: a top garfish line.":"Rub riječne vode skuplja mlađ i plankton: vrhunska linija za iglicu.","Garfish schools swing past points on the moving tide.":"Jata iglica prolaze pokraj rtova dok se voda kreće.","Garfish cruise the surface close to rocky shore, especially in spring and autumn.":"Iglice krstare površinom uz stjenovitu obalu, osobito u proljeće i jesen.","Garfish hunt fry round harbour walls and breakwater tips.":"Iglice love mlađ oko lučkih zidova i vrhova lukobrana.","Schools roam the surface in open water; look for small fish skipping.":"Jata lutaju površinom otvorenog mora; tražite sitnu ribu koja iskače.","Garfish feed on fry pushed out of the Mirna on the ebb.":"Iglice se za oseke hrane mlađi koju izbacuje Mirna.","No minimum size in Croatia. A favourite live bait for leerfish.":"U Hrvatskoj nema minimalne veličine. Omiljeni živi mamac za licu.","Orada":"Orada","gilthead bream":"Sparus aurata","Orada drop back to the channels and the edge of the bay.":"Orade se povlače u kanale i na rub uvale.","Orada push into shallow bays, flats and the river mouth as the tide rises. The best stage.":"Orade za plime ulaze u plitke uvale, plićake i ušće. Najbolja faza.","Orada feed right up in the shallows and along walls.":"Orade se hrane sasvim u plićaku i uz zidove.","Orada slide back out, feeding along the edges.":"Orade se vraćaju van, hraneći se uz rubove.","Orada gather at the Mirna mouth in autumn, feeding on mussels and crabs in the brackish water.":"Orade se u jesen okupljaju na ušću Mirne i hrane dagnjama i rakovima u bočatoj vodi.","Orada graze sand and mud for shellfish and worms as the tide comes in.":"Orade za plime pretražuju pijesak i mulj tražeći školjke i crve.","Mussels on harbour and marina walls draw orada right in.":"Dagnje na zidovima luke i marine privlače orade sasvim blizu.","Orada cruise close in over sand and weed, often in 1–3 m.":"Orade krstare blizu obale iznad pijeska i alga, često na 1–3 m.","Orada visit rocky points to crush mussels and small crabs.":"Orade obilaze stjenovite rtove da drobe dagnje i male rakove.","Orada pick up food carried along the plume edge.":"Orade skupljaju hranu koju nosi rub riječne vode.","Minimum size 20 cm.":"Minimalna veličina 20 cm.","Fratar":"Fratar","white bream":"Diplodus sargus","Fratar tuck in close to the rocks.":"Fratri se zavlače uz kamenje.","Fratar come up into the shallows to feed as the tide rises.":"Fratri za plime izlaze u plićak hraniti se.","Fratar feed along walls and rocks.":"Fratri se hrane uz zidove i kamenje.","Fratar pick food off the current at the points.":"Fratri na rtovima hvataju hranu iz struje.","Rocky points with broken bottom are the best fratar spots.":"Stjenoviti rtovi s razlomljenim dnom najbolja su mjesta za fratra.","Fratar feed along rocky shore, especially at dawn, dusk and night.":"Fratri se hrane uz stjenovitu obalu, osobito u zoru, sumrak i noću.","Breakwaters and marina walls hold plenty of fratar.":"Na lukobranima i zidovima marina ima mnogo fratara.","Bigger fratar hold on the rocky slope.":"Veći fratri drže se stjenovite padine.","Fratar hang around the rocky edges of the mouth.":"Fratri se zadržavaju uz stjenovite rubove ušća.","Minimum size 18 cm.":"Minimalna veličina 18 cm.","Špar":"Špar","annular bream":"Diplodus annularis","Špar stay close to rocks and seagrass.":"Šparovi ostaju blizu kamenja i morske trave.","Špar spread out feeding as the water rises.":"Šparovi se šire hraneći se kako voda raste.","Špar feed actively along the shore and walls.":"Šparovi se aktivno hrane uz obalu i zidove.","Špar keep feeding near cover as the water drops.":"Šparovi se nastavljaju hraniti uz zaklon dok voda pada.","Seagrass and rocks close to shore are classic špar ground.":"Morska trava i kamenje uz obalu klasična su pozicija za špara.","Harbour walls and moorings are full of špar.":"Lučki zidovi i vezovi puni su šparova.","Špar shoal round rocks and seagrass at the points.":"Šparovi se jataju oko kamenja i morske trave na rtovima.","Špar pick over weed and sand on the flat.":"Šparovi pretražuju alge i pijesak na plićaku.","Minimum size 12 cm.":"Minimalna veličina 12 cm.","Ribon":"Ribon","pandora / arbun":"Pagellus erythrinus","Ribon feed on the bottom through the tide; slack water makes it easier to hold bottom.":"Riboni se hrane na dnu tijekom cijele mijene; za mirovanja vode lakše je držati dno.","A gentle current spreads your bait scent. Good drifting.":"Blaga struja širi miris mamca. Dobar drift.","Steady bottom feeding; drift the sand edges.":"Stalno hranjenje na dnu; driftajte uz pjeskovite rubove.","Moving water helps a slow drift over the sand.":"Pokretna voda pomaže sporom driftu iznad pijeska.","Sand and mud at 20 m and more is classic ribon ground; fish it from a boat.":"Pijesak i mulj na 20 m i dublje klasična su pozicija za ribona; lovite iz broda.","Sand and rubble at 12–20 m is good ribon ground.":"Pijesak i šljunak na 12–20 m dobra su pozicija za ribona.","Ribon feed where the slope meets sand and rubble.":"Riboni se hrane gdje padina prelazi u pijesak i šljunak.","Ribon hold where rock meets sand below the points.":"Riboni se drže prijelaza kamena u pijesak ispod rtova.","Minimum size 15 cm.":"Minimalna veličina 15 cm.","Hake":"Oslić","oslić":"Merluccius merluccius","Hake stay on the bottom; the tide matters little.":"Oslići ostaju na dnu; mijena malo utječe.","Hake rise off the bottom at dusk to feed.":"Oslići se u sumrak dižu s dna hraniti se.","Hake feed through the night near the bottom.":"Oslići se cijelu noć hrane blizu dna.","Hake mostly live deeper than 40 m. In winter a few come into this 20–25 m channel at night.":"Oslići uglavnom žive dublje od 40 m. Zimi poneki noću uđu u ovaj kanal od 20–25 m.","Only the odd hake this shallow, and only at night.":"Ovako plitko tek pokoji oslić, i to samo noću.","Minimum size 20 cm (EU). Hake here are a winter night fishery from a boat.":"Minimalna veličina 20 cm (EU). Oslić se ovdje lovi zimi noću iz broda.","Squid":"Lignja","lignja":"Loligo vulgaris","Squid hold deeper over the seagrass edge.":"Lignje se drže dublje iznad ruba morske trave.","Rising water brings squid into the shallows and harbours at dusk.":"Plima u sumrak dovodi lignje u plićake i luke.","Squid hunt over seagrass and under harbour lights.":"Lignje love iznad morske trave i pod lučkim svjetlima.","Squid hunt small fish on the current at points and the harbour entrance.":"Lignje love sitnu ribu u struji na rtovima i ulazu u luku.","Harbour and marina lights draw bait and squid after dark.":"Svjetla luke i marine nakon mraka privlače sitnu ribu i lignje.","Squid hunt over seagrass close to shore at dusk and night.":"Lignje u sumrak i noću love iznad morske trave blizu obale.","Seagrass on the flat holds squid in autumn and winter.":"Morska trava na plićaku drži lignje u jesen i zimi.","Squid ambush small fish round the points at dusk.":"Lignje u sumrak vrebaju sitnu ribu oko rtova.","Squid hold on the edge in the day and rise at dusk.":"Lignje se danju drže ruba, a u sumrak se dižu.","No minimum size in the national list; check the current rules.":"Nema minimalne veličine u nacionalnom popisu; provjerite važeće propise.","Cuttlefish":"Sipa","sipa":"Sepia officinalis","Cuttlefish settle on sand at the edge of the seagrass.":"Sipe se smještaju na pijesak uz rub morske trave.","Cuttlefish move into the shallow bays with the rising tide.":"Sipe s plimom ulaze u plitke uvale.","Cuttlefish hunt shrimp over shallow sand and seagrass.":"Sipe love kozice iznad plitkog pijeska i morske trave.","Cuttlefish drift back to slightly deeper sand.":"Sipe se vraćaju na malo dublji pijesak.","Shallow sand and seagrass: the best cuttlefish ground, especially in spring.":"Plitki pijesak i morska trava: najbolja pozicija za sipu, osobito u proljeće.","Cuttlefish hunt over sand patches close to shore.":"Sipe love iznad pješčanih površina blizu obale.","Cuttlefish lay eggs on ropes and moorings in spring.":"Sipe u proljeće polažu jaja na konope i vezove.","Some cuttlefish feed at the edge of the river mouth.":"Poneka sipa hrani se na rubu ušća.","Predators":"Grabežljivci","Bream & bottom":"Ljuskavke i pridnene","Squid & cuttlefish":"Lignje i sipe","Good ground for this species.":"Dobra pozicija za ovu vrstu.","Some fish here.":"Ovdje ima nešto ribe.","Few fish here.":"Ovdje je malo ribe.","Mirna mouth":"Ušće Mirne","Novigrad harbour & breakwater":"Novigradska luka i lukobran","Tarska inner flat":"Unutarnji plićak Tarske uvale","Plume edge (current seam)":"Rub riječne vode (strujna granica)","Rt Sv. Petar – Antenal shore":"Rt Sv. Petar – obala Antenal","Rt Kras rocks":"Stijene rta Kras","Central Tarska bay":"Središnja Tarska uvala","Valeta drop-off":"Padina Valeta","Tarska bay entrance":"Ulaz u Tarsku uvalu","Rt Zub point":"Rt Zub","Uvala Pra – Novigrad south shore":"Uvala Pra – južna obala Novigrada","Rt Mujela – Karpinjan rocks":"Rt Mujela – stijene Karpinjan","Kostanjija coast":"Obala Kostanjije","Novigrad shelf":"Novigradski plato","Outer channel edge":"Vanjski rub kanala","Luka Červar bay & marina":"Uvala i marina Luka Červar","Rt Razba – Valetica rocks":"Rt Razba – stijene Valetica","Lanterna shore":"Obala Lanterne","Mrčana coves":"Uvale Mrčana","Rt Busuja point":"Rt Busuja","Červar inner shelf":"Unutarnji plato Červara","Rt Pical – Poreč north shore":"Rt Pical – sjeverna obala Poreča","Poreč harbour & Sv. Nikola channel":"Porečka luka i kanal Sv. Nikole","Sv. Nikola island, outer side":"Otok Sv. Nikola, vanjska strana","Brulo – Plava Laguna coves":"Uvale Brulo – Plava Laguna","Zelena Laguna islets":"Otočići Zelene Lagune","Funtana bay":"Uvala Funtana","Poreč inner shelf":"Unutarnji plato Poreča","Poreč plateau edge":"Rub porečkog platoa","Červar plateau edge":"Rub červarskog platoa","Open channel off Tarska":"Otvoreni kanal ispred Tarske","Offshore Kostanjija":"Pučina ispred Kostanjije","Open water off Červar":"Otvoreno more ispred Červara","Open water off Poreč":"Otvoreno more ispred Poreča","Live squid or cuttlefish":"Živa lignja ili sipa","3/0–5/0 hook plus a stinger":"Udica 3/0–5/0 i dodatna udica (stinger)","Slow-troll or drift it 1–3 m above rocky bottom on the drop-off at first light. Let the dentex run with it for a few seconds before you strike.":"U zoru je vucite polako ili driftajte 1–3 m iznad stjenovitog dna na padini. Pustite zubaca da s njom pliva nekoliko sekundi prije kontre.","Slow-pitch / metal jig":"Slow-pitch / metalni jig","Drop to the bottom, then lift-and-flutter in short sweeps through the bottom 5–10 m. Most hits come as the jig falls.":"Spustite do dna, zatim kratkim zamasima dižite i puštajte da pada kroz donjih 5–10 m. Većina udara dolazi dok jig pada.","Big minnow or stickbait from the rocks":"Veliki wobler ili stickbait sa stijena","14–18 cm, 30–50 g":"14–18 cm, 30–50 g","At dawn from steep points, fast and erratic over deep water close to the rocks.":"U zoru sa strmih rtova, brzo i nepravilno iznad duboke vode blizu stijena.","40–60 lb fluorocarbon leader: dentex teeth are sharp and they dive for the rocks. Minimum size 30 cm.":"Fluorokarbonski predvez 40–60 lb: zubi zubaca su oštri i bježi u stijene. Minimalna veličina 30 cm.","Small metal casting jig":"Mali metalni jig za bacanje","Cast ahead of breaking fish and wind as fast as you can. Bonito ignore slow lures.":"Bacite ispred ribe koja izbija na površinu i namatajte što brže možete. Palamide ignoriraju spore varalice.","Trolled feathers / squid skirts":"Perje / lignjice za panulu","5–8 cm, 30–50 m behind the boat at 4–6 kn":"5–8 cm, 30–50 m iza broda pri 4–6 čv","Steer along the edge of feeding schools, not through them.":"Vozite uz rub jata koja se hrane, ne kroz njih.","Shallow-diving minnow":"Plitkoronilački wobler","Troll at 4–6 kn or cast and rip it back fast.":"Panulajte pri 4–6 čv ili bacite i brzo trzajući vratite.","0.40–0.50 mm fluorocarbon leader; bonito have small sharp teeth and fight hard.":"Fluorokarbonski predvez 0,40–0,50 mm; palamide imaju sitne oštre zube i snažno se bore.","Live bait (garfish, mackerel, squid)":"Živi mamac (iglica, skuša, lignja)","2/0–5/0 circle hook, bridled":"Circle udica 2/0–5/0, mamac na omči","Slow-troll or drift it round rocky drop-offs, isolated rocks and buoys at 10–30 m. When the gof takes it, let it run for a few seconds, then wind tight and pull it away from the rocks.":"Polako panulajte ili driftajte oko stjenovitih padina, usamljenih hridi i bova na 10–30 m. Kad gof uzme, pustite ga nekoliko sekundi, zatim zategnite i odvucite ga od stijena.","Vertical / slow-pitch jig":"Vertikalni / slow-pitch jig","Drop to the bottom, then rip it up fast for 10–15 m with long sweeps and drop it again. Gof often hit as the jig turns at the top.":"Spustite do dna, zatim ga dugim zamasima brzo podignite 10–15 m i ponovno spustite. Gof često udari kad se jig okrene na vrhu.","Popper or big stickbait":"Popper ili veliki stickbait","14–18 cm, 40–70 g":"14–18 cm, 40–70 g","At first light over the drop-off or round floating objects: loud pops with pauses, or a fast walk. Small gof shoal under buoys and floating weed in late summer.":"U zoru iznad padine ili oko plutajućih predmeta: glasni udarci s pauzama ili brzi walk. Mali gofovi krajem ljeta stoje u jatima ispod bova i plutajućih alga.","Gof dive straight for the rocks: 60–80 lb fluorocarbon leader, 30–50 lb braid and a firm drag. Minimum size 45 cm.":"Gof bježi ravno u stijene: fluorokarbonski predvez 60–80 lb, upredenica 30–50 lb i čvrsta kočnica. Minimalna veličina 45 cm.","Float with a fish strip":"Plovak s trakom ribe","Thin strip of sardine or squid on a long-shank #8–#10 hook":"Tanak trak srdele ili lignje na udici dugog vrata #8–#10","Set the float shallow (0.5–1 m) and let it drift with the current along points, harbour walls and the plume edge. Strike slowly: garfish hold the bait in their beak first.":"Namjestite plovak plitko (0,5–1 m) i pustite ga da struja nosi uz rtove, lučke zidove i rub riječne vode. Kontrirajte polako: iglica najprije drži mamac u kljunu.","Bombarda (casting float) with a small streamer":"Bombarda s malom mušicom (streamer)","3–5 cm white or silver fly, 2–3 m leader":"Bijela ili srebrna mušica 3–5 cm, predvez 2–3 m","Cast far, then wind slowly and steadily just under the surface. The best way to reach schools out of range of a normal float.":"Bacite daleko, zatim namatajte polako i ravnomjerno tik ispod površine. Najbolji način da dosegnete jata izvan dometa običnog plovka.","Small spoon or spinner":"Mala žlica ili blinker","5–10 g, slim":"5–10 g, vitka","Fast retrieve just under the surface. Garfish follow it a long way; many hits miss the hook because of their hard beak, so use a small single hook or a thread loop.":"Brzo vođenje tik ispod površine. Iglice je dugo prate; mnogi udari promaše zbog tvrdog kljuna, pa koristite malu jednokraku udicu ili petlju od konca.","Light rod, 0.16–0.20 mm line, small sharp hooks. Their beak is hard and bony, so strike gently and keep the line tight.":"Lagani štap, najlon 0,16–0,20 mm, male oštre udice. Kljun im je tvrd i koščat, pa kontrirajte nježno i držite najlon napetim.","Mussels (dagnje)":"Dagnje","2–3 opened mussels, or the meat tied on with bait elastic; hook 1–1/0":"2–3 otvorene dagnje ili meso vezano elastičnim koncem; udica 1–1/0","Ledger rig on the bottom with a 1–1.5 m leader. Crush a few mussels as groundbait. Strike on the second, firmer pull.":"Pridnena montaža s predvezom 1–1,5 m. Zdrobite nekoliko dagnji za primamu. Kontrirajte na drugi, jači povlak.","Crab or hermit crab":"Rak ili rak samac","Small whole crab; hook 1/0–2/0":"Mali cijeli rak; udica 1/0–2/0","Best for bigger orada. Fish it hard on the bottom close to rocks and walls. Orada crush the shell, so give them time.":"Najbolje za veće orade. Lovite ga čvrsto na dnu uz kamenje i zidove. Orada drobi oklop, pa joj dajte vremena.","Polychaete worms (bibi) or shrimp":"Crvi (bibi) ili kozice","Hook #2–1":"Udica #2–1","Running ledger, or a sliding float set just off the bottom. Works well in stained water at the Mirna mouth.":"Klizna pridnena montaža ili klizni plovak namješten tik iznad dna. Dobro radi u zamućenoj vodi na ušću Mirne.","Orada crush hooks and fight hard: 0.28–0.30 mm fluorocarbon, strong short-shank hooks and a smooth drag. Minimum size 20 cm.":"Orade gnječe udice i snažno se bore: fluorokarbon 0,28–0,30 mm, jake udice kratkog vrata i glatka kočnica. Minimalna veličina 20 cm.","Polychaete worms or shrimp":"Crvi ili kozice","Hook #6–#2":"Udica #6–#2","Float rig drifted along the rocks at dawn and dusk, or a short ledger in gaps between rocks.":"Plovak koji pluta uz stijene u zoru i sumrak, ili kratka pridnena montaža u procjepima između kamenja.","Mussels or sardine fillet":"Dagnje ili file srdele","Hook #4–#1":"Udica #4–#1","Ledger close to breakwaters and points, especially at night in summer and autumn. Groundbait with crushed sardine.":"Pridnena montaža uz lukobrane i rtove, osobito noću ljeti i u jesen. Primamite zdrobljenom srdelom.","Small crab":"Mali rak","Hook #2–1/0":"Udica #2–1/0","For bigger fratar: fish it tight to the rocks and lift steadily so they can't run you into cover.":"Za veće fratre: lovite tik uz stijene i ravnomjerno dižite da vam ne pobjegnu u zaklon.","0.20–0.25 mm fluorocarbon leader. Minimum size 18 cm.":"Fluorokarbonski predvez 0,20–0,25 mm. Minimalna veličina 18 cm.","Worm pieces (bibi / korean worm)":"Komadi crva (bibi / korejski crv)","Hook #10–#14":"Udica #10–#14","Light float rig or a small running ledger next to rocks and seagrass. Strike at the first little tap.":"Lagani plovak ili mala klizna pridnena montaža uz kamenje i morsku travu. Kontrirajte na prvi mali trzaj.","Mussel or shrimp pieces":"Komadi dagnje ili kozice","Hook #10–#12":"Udica #10–#12","Fish it on the drop under a light float along harbour walls and moorings.":"Lovite u padanju ispod laganog plovka uz lučke zidove i vezove.","Bread paste":"Tijesto od kruha","Hook #12":"Udica #12","Simple and effective in harbours on calm days, with a bit of bread groundbait.":"Jednostavno i učinkovito u lukama za mirnih dana, uz malo primame od kruha.","0.14–0.18 mm leader and a light rod. Groundbait with crushed sardine or bread. Minimum size 12 cm.":"Predvez 0,14–0,18 mm i lagani štap. Primamite zdrobljenom srdelom ili kruhom. Minimalna veličina 12 cm.","Squid strips":"Trake lignje","Hooks #4–#6 on a 2–3 hook paternoster":"Udice #4–#6 na paternosteru s 2–3 udice","Drift from a boat over sand and rubble at 15–35 m, with the lead just tapping the bottom.":"Driftajte iz broda iznad pijeska i šljunka na 15–35 m, tako da olovo tek dodiruje dno.","Worms or sardine pieces":"Crvi ili komadi srdele","Hooks #4–#8":"Udice #4–#8","Same paternoster; slow drift along the edge where rock meets sand.":"Isti paternoster; spori drift uz rub gdje kamen prelazi u pijesak.","Small slow jig or inchiku":"Mali spori jig ili inchiku","Gentle lifts close to the bottom; ribon peck rather than slam it.":"Nježna podizanja blizu dna; ribon kljuca, ne udara snažno.","0.25–0.30 mm main line with 0.20–0.25 mm snoods. Minimum size 15 cm.":"Glavni najlon 0,25–0,30 mm s predvezima 0,20–0,25 mm. Minimalna veličina 15 cm.","Sardine strips":"Trake srdele","2-hook bottom rig, #1–1/0":"Pridnena montaža s 2 udice, #1–1/0","Anchor or drift at dusk and after dark in the deepest water. Hake bite best in the first hours of darkness.":"Usidrite se ili driftajte u sumrak i nakon mraka na najdubljoj vodi. Oslić najbolje grize u prvim satima mraka.","Slow jig":"Spori jig","Work it slowly just off the bottom at night.":"Noću ga vodite polako tik iznad dna.","Small whole fish (girica, sardine)":"Mala cijela riba (girica, srdela)","Hook 1/0–2/0":"Udica 1/0–2/0","Bottom rig in the channel on winter nights.":"Pridnena montaža u kanalu za zimskih noći.","0.35–0.40 mm leader: hake have needle teeth. This is boat fishing; there are few hake inside 20 m.":"Predvez 0,35–0,40 mm: oslić ima zube poput igala. Ovo je ribolov iz broda; unutar 20 m oslića je malo.","Squid jig (egi)":"Kalamarara (egi)","Size 2.5–3.0":"Veličina 2,5–3,0","Cast, count it down close to the seagrass, give 2–3 sharp lifts, then let it glide and sink for 5–10 seconds. Squid grab it on the fall.":"Bacite, pustite da potone blizu morske trave, dajte 2–3 oštra podizanja, zatim pustite da klizi i tone 5–10 sekundi. Lignje je hvataju dok pada.","Float jig with sardine (totanara)":"Totanara sa srdelom ispod plovka","Small luminous jig, sardine tied on":"Mala svjetleća totanara, privezana srdela","At night under harbour and marina lights: let it drift slowly at 2–4 m.":"Noću ispod svjetala luke i marine: pustite da polako pluta na 2–4 m.","Small egi from the boat":"Mala kalamarara iz broda","Size 2.0–2.5, with a 10–20 g sinker":"Veličina 2,0–2,5, s olovom 10–20 g","Drift over 8–15 m seagrass at dusk, jigging gently.":"U sumrak driftajte iznad morske trave na 8–15 m uz nježno trzanje.","Light spinning rod, 0.10–0.14 mm braid and a 0.20–0.25 mm fluorocarbon leader. Squid bite best just after sunset.":"Lagani spinning štap, upredenica 0,10–0,14 mm i fluorokarbonski predvez 0,20–0,25 mm. Lignje najbolje grizu odmah nakon zalaska sunca.","Squid / cuttlefish jig (egi)":"Kalamarara za lignje / sipe (egi)","Size 2.5–3.5, heavier model":"Veličina 2,5–3,5, teži model","Cast and let it sink to the bottom, then drag and hop it slowly over sand and seagrass with long pauses. Cuttlefish follow and grab it while it sits still.":"Bacite i pustite da potone do dna, zatim je polako vucite i podižite preko pijeska i morske trave uz duge pauze. Sipa je prati i zgrabi dok miruje.","Small dead fish on a cuttlefish rig":"Mala mrtva riba na montaži za sipe","Girica or sardine on a spiked jig":"Girica ili srdela na sipari s iglama","Drift it slowly along the bottom from the shore or a boat.":"Polako je vucite po dnu s obale ili iz broda.","Egi under a float":"Kalamarara ispod plovka","Size 2.0–2.5":"Veličina 2,0–2,5","In spring, over shallow seagrass where cuttlefish come in to lay eggs.":"U proljeće, iznad plitke morske trave kamo sipe dolaze polagati jaja.","Light rod and soft action: cuttlefish let go if you pull hard. Best in spring and again in autumn.":"Lagani štap mekane akcije: sipa pušta ako jako vučete. Najbolje u proljeće i ponovno u jesen.","Diving minnow":"Ronilački wobler","9–12 cm, dives 1–3 m":"9–12 cm, roni 1–3 m","Trolling spoon":"Žlica za panulu","6–9 cm":"6–9 cm","Feathers / squid skirt":"Perje / lignjica","6–10 cm":"6–10 cm","Run lures 30–50 m back along the bay mouth, the plume edge and the outer line. Bluefish often come in schools: when one bites, circle back through the same water.":"Vucite varalice 30–50 m iza broda uz ulaz u uvalu, rub riječne vode i vanjsku liniju. Strijelke često dolaze u jatima: kad jedna zagrize, vratite se kroz isto more.","Wire or 50 lb fluorocarbon leader: bluefish cut line.":"Čelični ili fluorokarbonski predvez 50 lb: strijelka reže najlon.","1–2 kn with live bait, 3–4 kn with lures":"1–2 čv sa živim mamcem, 3–4 čv s varalicama","Live mullet or garfish":"Živi cipal ili iglica","20–30 cm, bridled on a 4/0–6/0 circle hook":"20–30 cm, na omči s circle udicom 4/0–6/0","Live squid":"Živa lignja","slow-trolled at about 1 kn":"sporo panulanje pri oko 1 čv","Deep-diving minnow":"Duboko ronilački wobler","14–18 cm, dives 3–5 m":"14–18 cm, roni 3–5 m","Run baits 20–40 m back along the 4–10 m line, past points, the river mouth and harbour entrances, at dawn and dusk. Leerfish follow a long way: when the rod bends don't speed up, give it 5 seconds.":"U zoru i sumrak vucite mamce 20–40 m iza broda uz liniju od 4–10 m, pokraj rtova, ušća i ulaza u luke. Lica dugo prati: kad se štap savije, ne ubrzavajte, pričekajte 5 sekundi.","50–60 lb fluorocarbon leader and 30–50 lb braid.":"Fluorokarbonski predvez 50–60 lb i upredenica 30–50 lb.","12–14 cm, dives 0.5–1.5 m":"12–14 cm, roni 0,5–1,5 m","Live mullet or shrimp":"Živi cipal ili kozica","slow-trolled close to the rocks":"sporo panulanje blizu stijena","Troll very close (20–50 m) to rocky points and white water at first light, and along the river mouth edge on the ebb. Rough, stained days are best.":"U zoru panulajte vrlo blizu (20–50 m) stjenovitih rtova i pjene, a za oseke uz rub ušća. Najbolji su valoviti dani sa zamućenom vodom.","25–30 lb fluorocarbon leader.":"Fluorokarbonski predvez 25–30 lb.","2-hook rig, 1–3 m off the bottom":"Montaža s 2 udice, 1–3 m iznad dna","15–20 cm, dives 10–20 m":"15–20 cm, roni 10–20 m","Follow the drop-off at 15–25 m at first light, with a downrigger or a 200–500 g trolling lead keeping the bait just above the rocks.":"U zoru pratite padinu na 15–25 m, s downriggerom ili olovom od 200–500 g koje drži mamac tik iznad stijena.","40–60 lb fluorocarbon leader.":"Fluorokarbonski predvez 40–60 lb.","Small feathers / squid skirts":"Malo perje / lignjice","5–8 cm, single or a daisy chain of 2":"5–8 cm, pojedinačno ili niz od 2","30–50 m behind the boat, in or just outside the propeller wash. Steer for birds and bait breaking the surface, and cut across the edge of the school rather than through it.":"30–50 m iza broda, u brazdi propelera ili tik izvan nje. Vozite prema pticama i sitnoj ribi na površini i presijecite rub jata, ne prolazite kroz njega.","0.40–0.50 mm fluorocarbon leader, 3–5 m long.":"Fluorokarbonski predvez 0,40–0,50 mm, dužine 3–5 m.","1–2 kn with live bait, 4–6 kn with lures":"1–2 čv sa živim mamcem, 4–6 čv s varalicama","Live garfish, mackerel or squid":"Živa iglica, skuša ili lignja","bridled on a 4/0–6/0 circle hook, 5–15 m down":"na omči s circle udicom 4/0–6/0, 5–15 m dubine","15–20 cm, dives 8–15 m":"15–20 cm, roni 8–15 m","10–15 cm":"10–15 cm","Work the drop-off and isolated rocks at 15–30 m at first light, and pass close to buoys, mussel farms and floating objects. When a gof hooks up, steer away from the rocks straight away.":"U zoru lovite padinu i usamljene hridi na 15–30 m i prolazite blizu bova, uzgajališta dagnji i plutajućih predmeta. Kad se gof zakači, odmah skrenite od stijena.","60–80 lb fluorocarbon leader and a strong drag.":"Fluorokarbonski predvez 60–80 lb i jaka kočnica.","not trolled":"ne lovi se panulom","Hake aren't caught trolling. They live on the bottom, mostly deeper than 40 m, and only a few come into the 20–25 m channel on winter nights. Anchor or drift there after dark with sardine strips on a 2-hook bottom rig.":"Oslić se ne lovi panulom. Živi na dnu, uglavnom dublje od 40 m, a tek poneki zimskih noći uđe u kanal od 20–25 m. Ondje se nakon mraka usidrite ili driftajte s trakama srdele na pridnenoj montaži s 2 udice.","0.35–0.40 mm leader.":"Predvez 0,35–0,40 mm.","3–5 kn":"3–5 čv","2–3 kn":"2–3 čv","1–2 kn":"1–2 čv","4–6 kn":"4–6 čv","Inshore line: Mirna plume to Kostanjija":"Obalna linija: od riječne vode Mirne do Kostanjije","Inshore line":"Obalna linija","Along the edge of the river plume, past Rt Sv. Petar and the Novigrad breakwater, then up the rocky coast to Rt Štrunac. Stay 100–200 m off the rocks.":"Uz rub riječne vode, pokraj rta Sv. Petar i novigradskog lukobrana, zatim uz stjenovitu obalu do rta Štrunac. Držite se 100–200 m od stijena.","Tarska bay mouth: Rt Zub to Rt Kras":"Ulaz u Tarsku uvalu: od rta Zub do rta Kras","Tarska bay mouth":"Ulaz u Tarsku uvalu","Across the south side of the bay mouth where the slope drops off. Good on the ebb when river water flows out.":"Preko južne strane ulaza u uvalu gdje dno naglo pada. Dobro za oseke kad riječna voda istječe.","Outer line off Novigrad":"Vanjska linija ispred Novigrada","The 15–22 m line about 1.5 km off the coast, where bonito schools travel along the shore in autumn.":"Linija od 15–22 m oko 1,5 km od obale, kuda u jesen uz obalu putuju jata palamida.","Červar inshore: Lanterna to Šilok":"Obala Červara: od Lanterne do Šiloka","Červar inshore":"Obala Červara","Past Valetica, Rt Razba, the mouth of Luka Červar, Mali Školj, the Mrčana coves and Rt Busuja, about 100–250 m off the rocks.":"Pokraj Valetice, rta Razba, ulaza u Luku Červar, Malog Školja, uvala Mrčana i rta Busuja, oko 100–250 m od stijena.","Where the 12–16 m plateau starts to drop off, about 1 km out. Dentex and bonito follow this edge at first light.":"Gdje plato od 12–16 m počinje padati, oko 1 km od obale. Zubaci i palamide u zoru prate ovaj rub.","Offshore Červar":"Pučina ispred Červara","The open 20–25 m water about 2.5 km out, for bonito schools in autumn.":"Otvoreno more od 20–25 m oko 2,5 km od obale, za jata palamida u jesen.","Poreč inshore: Rt Materada to Funtana":"Obala Poreča: od rta Materada do Funtane","Poreč inshore":"Obala Poreča","Past Rt Sv. Martin, outside Sv. Nikola island, along Brulo and Plava Laguna and round the Zelena Laguna islets to Funtana. Keep clear of the swimming zones off the beaches.":"Pokraj rta Sv. Martin, s vanjske strane otoka Sv. Nikola, uz Brulo i Plavu Lagunu te oko otočića Zelene Lagune do Funtane. Izbjegavajte kupališne zone ispred plaža.","The 12–16 m edge about 1–1.5 km off the coast, outside the islets. Dentex and bonito follow it at first light.":"Rub od 12–16 m oko 1–1,5 km od obale, s vanjske strane otočića. Zubaci i palamide u zoru ga prate.","Offshore Poreč":"Pučina ispred Poreča","Open 20–26 m water 2–3 km out, where bonito schools pass in autumn.":"Otvoreno more od 20–26 m, 2–3 km od obale, kuda u jesen prolaze jata palamida.","Troll:":"Panula:","peak season":"vrhunac sezone","in season":"u sezoni","fair season":"osrednja sezona","off season":"izvan sezone","good season":"dobra sezona","Natural bait":"Prirodni mamac","Rig":"Montaža","Lines":"Linije","Area":"Područje","Lines follow the depth contours from the seabed data":"Linije prate izobate iz podataka o morskom dnu","← Map":"← Karta","What to troll":"Što panulati","bait, lures, speed":"mamci, varalice, brzina","Show troll lines on the map":"Prikaži linije za panulu na karti","Troll lines are a starting point drawn from depth data, not marked fishing spots. Watch for swimmers, buoys, mussel farms and divers, keep clear of harbour entrances and swimming zones, and follow the speed limits near the coast. Not for navigation.":"Linije za panulu su polazna točka izrađena iz podataka o dubini, a ne označena ribolovna mjesta. Pazite na kupače, bove, uzgajališta dagnji i ronioce, izbjegavajte ulaze u luke i kupališne zone te poštujte ograničenja brzine uz obalu. Nije za navigaciju.","Trolling lines on. Tap a line for bait, lures and speed.":"Linije za panulu uključene. Dodirnite liniju za mamce, varalice i brzinu.","Trolling lines off":"Linije za panulu isključene","Tarska–Novigrad":"Tarska–Novigrad","Troll":"Panula","Sardine (blue back, silver)":"Srdela (plava leđa, srebrna)","Chrome / mirror":"Krom / ogledalo","White / pearl":"Bijela / biserna","Pink back, white belly":"Ružičasta leđa, bijeli trbuh","Bone":"Boja kosti","Mullet (grey back, silver)":"Cipal (siva leđa, srebrna)","Ghost / translucent":"Prozirna (ghost)","Natural (brown, shrimp)":"Prirodna (smeđa, kozica)","Chartreuse":"Chartreuse (žuto-zelena)","Gold / orange belly":"Zlatna / narančasti trbuh","Black / dark purple":"Crna / tamnoljubičasta","Glow (UV / luminous)":"Svjetleća (UV / fosforescentna)","Surface stickbait":"Površinski stickbait","Popper":"Popper","Sinking stickbait":"Tonući stickbait","Floating minnow":"Plutajući wobler","Sinking minnow":"Tonući wobler","Sinking pencil":"Tonuća olovka (pencil)","Metal jig":"Metalni jig","Slow-pitch jig":"Slow-pitch jig","Inchiku":"Inchiku","Soft shad / swimbait":"Silikonac / swimbait","Slug / jerkshad":"Slug / jerkshad","Feathers / skirt":"Perje / suknjica","Bombarda + fly":"Bombarda + mušica","Live fish":"Živa riba","Live squid / cuttlefish":"Živa lignja / sipa","Mussels":"Dagnje","Worms":"Crvi","Shrimp":"Kozice","Crab":"Rak","Sardine":"Srdela","Bread / paste":"Kruh / tijesto","Fast walk-the-dog":"Brzi walk-the-dog","Pop-pop-pause":"Pop-pop-pauza","Fast steady":"Brzo i ravnomjerno","Medium steady":"Srednje i ravnomjerno","Slow steady":"Polako i ravnomjerno","Twitch & pause":"Trzaj i pauza","Count-down & rip":"Potapanje i trzaj","Lift & flutter (jig)":"Podizanje i padanje (jig)","Egi: lift & glide":"Egi: podizanje i klizanje","Drag on the bottom":"Vučenje po dnu","Slow trolling live bait":"Spora panula sa živim mamcem","Drifting (boat)":"Drift (brod)","Bottom ledger":"Pridnena montaža","Float":"Plovak","Drift in current":"Pluta u struji","Static bait":"Mamac miruje","11–13 cm, 25–35 g":"11–13 cm, 25–35 g","Cast up-wind of the edge, let it sink 2–3 s, then wind fast and steady with short rod-tip twitches. It stays in the water when the surface is choppy.":"Bacite uz vjetar iznad ruba, pustite da tone 2–3 s, zatim namatajte brzo i ravnomjerno uz kratke trzaje vrhom štapa. Ostaje u vodi i kad je površina valovita.","Surface stickbait or popper":"Površinski stickbait ili popper","12–14 cm, 20–30 g":"12–14 cm, 20–30 g","Fast walk-the-dog with the rod tip down, or a steady pop-pop-pause. When a fish swirls behind it keep going or speed up; stopping usually makes bluefish turn away.":"Brzi walk-the-dog s vrhom štapa prema dolje ili ravnomjerni pop-pop-pauza. Kad riba zavrtloži iza varalice, nastavite ili ubrzajte; zaustavljanje strijelku obično odbije.","Metal casting jig":"Metalni jig za bacanje","Long cast, count it down near the bottom (about 1 m per second), then wind as fast as you can with a jerk every 3–4 turns. Use it when fish sit deep or nothing shows on top.":"Dugi zabačaj, pustite ga blizu dna (oko 1 m u sekundi), zatim namatajte što brže uz trzaj svakih 3–4 okretaja. Koristite ga kad je riba duboko ili se ništa ne vidi na površini.","Sinking minnow or 10–12 cm soft shad":"Tonući wobler ili silikonac 10–12 cm","9–12 cm, 10–20 g head":"9–12 cm, glava 10–20 g","Medium-fast with 2–3 sharp twitches, then a one-second pause. Good at slack water when fish follow but won't hit a fast lure.":"Srednje brzo uz 2–3 oštra trzaja, zatim pauza od sekunde. Dobro za mirovanja vode kad riba prati, ali neće udariti brzu varalicu.","Bluefish teeth cut light line: use a 30–40 lb fluorocarbon leader or 15–20 cm of wire, and single or barbless hooks.":"Zubi strijelke režu tanki najlon: koristite fluorokarbonski predvez 30–40 lb ili 15–20 cm čelika te jednokrake udice ili udice bez kontrakuke.","Big surface stickbait":"Veliki površinski stickbait","14–18 cm, 30–45 g":"14–18 cm, 30–45 g","Fast, rhythmic walk-the-dog all the way to your feet. Leerfish follow a long way before they hit; don't slow down or stop.":"Brzi, ritmični walk-the-dog sve do nogu. Lica dugo prati prije udarca; ne usporavajte i ne zaustavljajte.","15–25 cm bait, 2/0–5/0 hook":"Mamac 15–25 cm, udica 2/0–5/0","Free-line it, or fish it under a float, letting it swim along the current edge. Give the fish 3–5 seconds before you strike.":"Pustite ga slobodno ili ispod plovka da pliva uz rub struje. Dajte ribi 3–5 sekundi prije kontre.","Soft swimbait on a jighead":"Silikonski swimbait na jig glavi","15–18 cm, 20–30 g head":"15–18 cm, glava 20–30 g","Steady medium retrieve a metre or two down with the odd pause. Good in the day or when nothing shows on top.":"Ravnomjerno srednje brzo vođenje metar-dva ispod površine uz poneku pauzu. Dobro danju ili kad se ništa ne vidi na površini.","Leerfish mouths are rough as sandpaper: use a 50–60 lb fluorocarbon leader, 30–40 lb braid and a firm drag.":"Usta lice hrapava su poput brusnog papira: koristite fluorokarbonski predvez 50–60 lb, upredenicu 30–40 lb i čvrstu kočnicu.","Floating minnow (shallow diver)":"Plutajući wobler (plitkoronilac)","12–14 cm, 15–20 g":"12–14 cm, 15–20 g","Slow and steady just under the surface. Cast across the current or white water and let it swing round; seabass often hit on the swing.":"Polako i ravnomjerno tik ispod površine. Bacite poprijeko struje ili pjene i pustite da se zanese u luku; lubin često udari tijekom zanošenja.","Soft slug / weedless jerkshad":"Silikonski slug / jerkshad bez zapinjanja","12–15 cm, unweighted or 3–5 g":"12–15 cm, bez olova ili 3–5 g","Twitch-twitch-pause so it darts and glides over shallow rocks and weed. Let it sink for a second on the pause.":"Trzaj-trzaj-pauza da skače i klizi iznad plitkog kamenja i alga. Tijekom pauze pustite ga da tone sekundu.","10–12 cm, 15–25 g":"10–12 cm, 15–25 g","Cast far, keep the rod tip high and wind slowly so it wobbles just under the waves. Good in wind, chop and at the river mouth.":"Bacite daleko, držite vrh štapa visoko i namatajte polako da se njiše tik ispod valova. Dobro po vjetru, valovima i na ušću.","Bait: shrimp, worms or sardine":"Mamac: kozice, crvi ili srdela","1/0–2/0 hook, 20–40 g lead":"Udica 1/0–2/0, olovo 20–40 g","At night fish live shrimp, polychaete worms (bibi) or a sardine fillet on a running ledger at the Mirna mouth. Leave it still.":"Noću na ušću Mirne lovite živu kozicu, crve (bibi) ili file srdele na kliznoj pridnenoj montaži. Neka miruje.","20–25 lb fluorocarbon leader. Seabass under 25 cm must go back; cut the lower tail-fin lobe on any you keep.":"Fluorokarbonski predvez 20–25 lb. Lubini ispod 25 cm moraju natrag u more; zadržanima odrežite donji režanj repne peraje.","Retrieve":"Vođenje","Where":"Gdje","Species":"Vrsta","peak":"vrhunac","good":"dobro","fair":"osrednje","Tide stages over the forecast":"Faze plime i oseke u prognozi","Sunrise":"Izlazak sunca","Sunset":"Zalazak sunca","Sunrise {n}":"Izlazak sunca {n}","Sunset {n}":"Zalazak sunca {n}","tide n/a":"plima nepoznata","m waves":"m valovi","{n} m waves":"valovi {n} m","overcast":"oblačno","{n} kn":"{n} čv","{n}% cloud":"{n}% naoblake","Season":"Sezona","Moon":"Mjesec","{n}% lit":"{n}% osvijetljen","{n}% lit (dark nights)":"{n}% osvijetljen (tamne noći)","(dark nights)":"(tamne noći)","Moon overhead":"Mjesec u zenitu","Moon underfoot":"Mjesec u nadiru","Moonrise":"Izlazak mjeseca","Moonset":"Zalazak mjeseca","Solunar":"Solunarno","and":"i","or":"ili","near first or last light":"blizu zore ili sumraka","Moon overhead near first or last light":"Mjesec u zenitu blizu zore ili sumraka","Moon underfoot near first or last light":"Mjesec u nadiru blizu zore ili sumraka","Moonrise near first or last light":"Izlazak mjeseca blizu zore ili sumraka","Moonset near first or last light":"Zalazak mjeseca blizu zore ili sumraka","No solunar period at dawn or dusk":"Nema solunarnog razdoblja u zoru ili sumrak","Sea temp":"Temp. mora","{n} °C (estimated)":"{n} °C (procjena)","(estimated)":"(procjena)","Weather":"Vrijeme","Typical value until the forecast reaches this day":"Tipična vrijednost dok prognoza ne dosegne ovaj dan","Your log":"Vaš dnevnik","From your {n} catches":"Iz vaših {n} ulova","From your":"Iz vaših","catches":"ulova","{n} catches":"{n} ulova","Adjusted with your {n} logged catches.":"Prilagođeno prema vaših {n} zabilježenih ulova.","Adjusted with your":"Prilagođeno prema vaših","logged catches.":"zabilježenih ulova.","{n} of your catches":"{n} vaših ulova","of your catches": rad · sljedećih {n} dana","live forecast":"prognoza uživo","The score adds up season, moon, solunar periods at dawn and dusk, sea temperature and, where the live forecast reaches, tide, wind and waves at the best times of day for this species":"Ocjena zbraja sezonu, mjesec, solunarna razdoblja u zoru i sumrak, temperaturu mora te, dokle seže prognoza uživo, plimu, vjetar i valove u najbolje doba dana za ovu vrstu","It's an outlook to plan around, not a count of fish.":"To je izgled za planiranje, a ne broj riba.","Bait":"Mamac","Lure":"Varalica","Colour":"Boja","Score":"Ocjena","Couldn't save. Try again.":"Spremanje nije uspjelo. Pokušajte ponovno.","Couldn't remove it. Try again.":"Uklanjanje nije uspjelo. Pokušajte ponovno.","Photo on another device":"Fotografija je na drugom uređaju","Month / season":"Mjesec / sezona","Log a few catches and this turns into a breakdown of when, where and on what you catch: tide stage, time of day, month, moon, wind, sea temperature, lure and colour.":"Zabilježite nekoliko ulova i ovdje ćete vidjeti kada, gdje i na što lovite: faza plime, doba dana, mjesec, mjesečeva mijena, vjetar, temperatura mora, varalica i boja.","Calm <{n} kn":"Tišina <{n} čv","Light 5–12":"Slab 5–12","Moderate 12–20":"Umjeren 12–20","Strong 20+":"Jak 20+","Wind direction":"Smjer vjetra","Sea temperature":"Temperatura mora","Zone":"Zona","tide":"plima","Pattern so far:":"Dosadašnji obrazac:","Patterns show up after about 3 fish, and get reliable at 10 or more.":"Obrasci se pojavljuju nakon otprilike 3 ribe, a pouzdani su od 10 naviše.","fish":"riba","blank sessions":"izlasci bez ulova","biggest, cm":"najveća, cm","average, cm":"prosjek, cm","Blank session":"Izlazak bez ulova","yes":"da","no":"ne","Saved to your account, private to you":"Spremljeno na vaš račun, vidljivo samo vama","Saved on this device":"Spremljeno na ovom uređaju","entry":"unos","entries":"unosa","{n} entry":"{n} unos","{n} entries":"{n} unosa","Nothing logged yet.":"Još ništa nije zabilježe
